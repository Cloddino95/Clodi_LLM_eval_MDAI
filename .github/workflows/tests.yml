name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 01_general_information_and_requirements/requirements.txt

      - name: Install CPU-only test dependency
        run: python -m pip install "PyYAML>=6.0"

      - name: Compile Python sources
        run: >-
          python -m compileall -q src tests run_study.py
          02_testing/diagnose_prompt.py 03_evaluation/run_eval.py
          05_data_analysis/analyze_results.py
          01_general_information_and_requirements/scripts/download_models.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v
